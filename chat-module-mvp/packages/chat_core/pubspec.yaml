name: chat_core
description: Domain + data layer cho module chat (ACS + BE nội bộ). Dart thuần, không phụ thuộc widget UI.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'
  # Ghi chú: chat_core phụ thuộc chat_native_platform_interface (plugin
  # Flutter, dùng EventChannel) cho phần data/native — nên dù domain
  # layer không đụng widget UI, package này vẫn cần chạy trong ngữ cảnh
  # Flutter (không còn là "pure Dart VM package" theo nghĩa chặt).
  flutter: '>=3.19.0'

dependencies:
  http: ^1.2.0
  meta: ^1.11.0
  web_socket_channel: ^3.0.0
  chat_native_platform_interface:
    path: ../chat_native_platform_interface

dev_dependencies:
  test: ^1.25.0
  mocktail: ^1.0.3
  lints: ^4.0.0
