name: chat_ui
description: Widget mặc định cho module chat, phụ thuộc chat_core.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  chat_core:
    path: ../chat_core
  flutter_riverpod: ^3.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^7.1.1
  scrollable_positioned_list: ^0.3.8
  file_picker: ^11.0.2
  image_picker: ^1.1.2
  # Phát video ngay trong bong bóng chat.
  video_player: ^2.9.2
  html: ^0.15.4
  url_launcher: ^6.3.1
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
